name: Build Bot artifacts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/build-bot.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      GOMEMLIMIT: 3GiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
          cache: true
      - name: Build full Bot and MTProto test executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -p 1 -gcflags='github.com/gotd/td/tg=-l' -ldflags='-s -w' -o dist/sbbot ./cmd/sbbot
          go test -c -p 1 -gcflags='github.com/gotd/td/tg=-l' -o dist/mtproto.test ./internal/mtproto
          git rev-parse HEAD > dist/COMMIT
          sha256sum dist/sbbot dist/mtproto.test > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sbbot-linux-amd64-${{ github.sha }}
          path: dist/
          retention-days: 7
